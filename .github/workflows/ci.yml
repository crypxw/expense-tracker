name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out code using the latest runner patch
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    # Step 2: Set up Buildx context with updated versioning
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.10.0

    # Step 3: Enable layers caching to speed up subsequent workflow executions
    - name: Cache Docker layers
      uses: actions/cache@v4.2.2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    # Step 4: Build image definitions using compose build kits
    - name: Build Docker Images
      run: |
        docker compose build --build-arg BUILDKIT_INLINE_CACHE=1

    # Step 5: Boot services cleanly in the background
    - name: Start Services
      run: docker compose up -d

    # Step 6: Execute tests safely inside the container (-T removes interactive terminal errors)
    - name: Run Tests
      run: docker compose exec -T web python -m pytest

    # Step 7: Clear active runner resources and volumes upon completion
    - name: Shut down services
      if: always()
      run: docker compose down -v
