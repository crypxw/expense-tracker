name: Continuous Integration & Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # STAGE 1: Run your test suite inside the container environment
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: expense_tracker_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Build Docker Images
      run: docker compose build

    - name: Start Services
      run: docker compose up -d

    - name: Wait for services
      run: sleep 5
  # ADDING THIS STEP HERE TO DEBUG THE CRASH:
    - name: View Container Logs on Failure
      if: always()
      run: docker compose logs web

    - name: Run Tests
      run: docker compose exec -T web python -m pytest
    - name: Run Tests
      run: docker compose exec -T web python -m pytest

    - name: Shut down services
      if: always()
      run: docker compose down -v

  # STAGE 2: Build and push the final production image to Docker Hub
  deploy:
    runs-on: ubuntu-latest
    needs: test # Only runs if the test job completes successfully
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    # Log into Docker Hub securely using your saved repository secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3.3.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build the production image and push it to your public repository registry
    - name: Build and Push Production Docker Image
      uses: docker/build-push-action@v6.13.0
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Automatically tags it as 'latest' and with the unique Git commit SHA hash
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker:${{ github.sha }}

