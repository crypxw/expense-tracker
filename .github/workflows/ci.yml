name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # We inject the environment variables here so Docker Compose can read them
    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: expense_tracker_test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Build Docker Images
      run: docker compose build

    - name: Start Services
      run: docker compose up -d

    # Give the database a brief moment to finish initializing before running tests
    - name: Wait for services
      run: sleep 5

    - name: Run Tests
      run: docker compose exec -T web python -m pytest

    - name: Shut down services
      if: always()
      run: docker compose down -v

